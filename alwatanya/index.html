<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a6fd6"><title>الوطنية موتورز — HINDAWY Agency</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Outfit:wght@400;600;800&display=swap">
<style>
/* Layout: مساحة العميل — نفس صفحات المشاريع، بهوية عرض الوطنية (فاتح وأزرق) */
:root{--bg:#f3f7fc;--card:#fff;--fg:#0c1729;--mute:#596679;--line:#0c17291f;--brand:#0a6fd6;--tint:#e7f1fd;--f-ar:"Tajawal","Segoe UI",Tahoma,sans-serif;--f-en:"Outfit","Tajawal",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ar);direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.agency{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:4px}
.agency .mark{font-family:var(--f-en);font-weight:800;font-size:22px;letter-spacing:5px;direction:ltr;text-decoration:none;color:inherit}
.agency .mark span{font-weight:400;letter-spacing:3px;color:var(--mute);font-size:14px;margin-left:6px}
.agency small{font-size:13px;color:var(--mute)}
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(120deg,#0a4f9f,#0a6fd6);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.badge{width:72px;height:72px;border-radius:22px;background:#fff;color:#0a4f9f;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--f-en);font-weight:800;font-size:28px;direction:ltr}
.hero h1{margin:0;font-size:28px;font-weight:800;line-height:1.25;text-wrap:balance}
.hero p{margin:6px 0 0;font-size:16px;color:#dcebfb;line-height:1.7}
.tile{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s;min-width:0}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.tile:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--tint);color:var(--brand)}
.ic svg{width:28px;height:28px}
.txt{flex:1;min-width:0}.txt b{display:block;font-size:19px;font-weight:800}.txt span{display:block;font-size:15px;color:var(--mute);line-height:1.7}
.byline{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px 4px;text-align:center}
.byline small{font-size:12px;letter-spacing:3px;color:var(--mute);font-family:var(--f-en)}
.byline strong{font-family:var(--f-en);font-weight:800;font-size:clamp(36px,10vw,64px);line-height:1;letter-spacing:clamp(4px,1.4vw,10px);direction:ltr}
.byline a.hw{text-decoration:none;color:inherit}
.byline em{font-style:normal;font-family:var(--f-en);font-size:14px;color:var(--mute);direction:ltr}
.hw-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.hw-btns a{font-size:14px;font-weight:700;text-decoration:none;color:inherit;padding:7px 14px;border-radius:99px;border:1px solid currentColor;opacity:.85}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
<div class="wrap">
 <div class="agency"><a class="mark" href="../">HINDAWY<span>AGENCY</span></a><small>مساحة العميل</small></div>
 <header class="hero">
  <span class="badge">AW</span>
  <div style="min-width:0;flex:1">
   <h1>الوطنية موتورز</h1>
   <p>نظام يشغّل المعرض كله: شات بوت على وسائل التواصل، وإدارة المبيعات والمخزون والصيانة والجوابات والمكسب.</p>
  </div>
 </header>

  <span class="txt"><b>افتح العرض</b><span>شرح كل فكرة خطوة خطوة، وشكل شاشات النظام</span></span>
 </a>

</div>
