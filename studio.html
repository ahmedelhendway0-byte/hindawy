(function(){
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open(pw){
    var key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},key,{name:"AES-CBC",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(BLOB.i)},k,b64(BLOB.c));
    var html=new TextDecoder().decode(pt);
    if(html.indexOf("STUDIO-OK")!==0)throw new Error("bad");
    return html.slice(9);
  }
  function show(html){var o=document.getElementById("out");o.innerHTML=html;o.hidden=false;document.getElementById("gate").hidden=true;document.getElementById("lock").hidden=false}
  document.getElementById("gate").addEventListener("submit",function(e){
    e.preventDefault();var pw=document.getElementById("pw").value,err=document.getElementById("err"),go=document.getElementById("go");
    err.textContent="";go.disabled=true;go.textContent="بيفتح…";
    open(pw).then(function(h){show(h);try{sessionStorage.setItem("hs",pw)}catch(x){}},function(){err.textContent="كلمة السر غلط. جرّب تاني."})
      .then(function(){go.disabled=false;go.textContent="فتح"});
  });
  document.getElementById("lock").addEventListener("click",function(e){e.preventDefault();try{sessionStorage.removeItem("hs")}catch(x){}location.reload()});
  try{var s=sessionStorage.getItem("hs");if(s)open(s).then(show,function(){})}catch(x){}
})();
