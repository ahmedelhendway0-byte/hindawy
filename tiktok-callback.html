<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>HINDAWY OS: TikTok connection</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 18px;color:#1b1613;text-align:center}button{font:inherit;background:#f05a14;color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}</style></head><body>
<h1>Almost done</h1><p id="m">Press the button, then return to the terminal window.</p><button id="b" type="button">Copy connection code</button>
<script>
var q=new URLSearchParams(location.search),c=q.get("code"),s=q.get("state"),m=document.getElementById("m"),b=document.getElementById("b");
if(!c){m.textContent=q.get("error")?"TikTok did not connect: "+q.get("error"):"No connection code found.";b.hidden=true}
else{history.replaceState(null,"",location.pathname);b.onclick=function(){navigator.clipboard.writeText("TTCODE:"+s+":"+c).then(function(){m.textContent="Copied. Return to the terminal.";b.hidden=true})}}
</script></body></html>
